<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polytrack</title>

<script src="coi-serviceworker.js"></script>

<style>
body {
    margin: 0;
    padding: 0;
    background-color: #5f9ea0;
    color: white;
    text-align: center;
    /* Change 'hidden' to 'auto' to allow scrolling if the content is too tall */
    overflow-y: auto; 
    /* This prevents the 'bounce' effect on Chromebooks/Mobile */
    overscroll-behavior-y: contain; 
}
a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.game-wrapper {
    margin: 30px auto;
    max-width: 900px;
}

.game-container {
    position: relative;
    width: 100%;
    height: 600px;
    background: rgba(0,0,0,0.5);
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(95,158,160,0.8);
    overflow: hidden;
}

/* Updated for Polytrack Elements */
#game-content-anchor {
    width: 100%;
    height: 100%;
    outline: none;
    position: relative;
}

canvas#screen {
    width: 100%;
    height: 100%;
    display: block;
}

#ui, #transition-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* Fullscreen Fix */
.game-container:fullscreen {
    width: 100vw;
    height: 100vh;
    border-radius: 0;
}

.fullscreen-btn {
    margin-top: 15px;
    padding: 10px 20px;
    background: #222;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-size: 14px;
}

.fullscreen-btn:hover {
    background: #333;
}

/* Keyboard overlay */
#keyboard-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    cursor: default;
    z-index: 100;
    color: white;
    text-align: center;
}
#keyboard-overlay small {
    font-size: 16px;
    margin-top: 10px;
}
</style>
</head>
<body>

<h1>Polytrack</h1>
<p><a href="../../index.html">← Back to Home</a></p>

<div class="game-wrapper">
    <div class="game-container" id="gameContainer">
        <div id="game-content-anchor" tabindex="0">
            <canvas id="screen"></canvas>
            <div id="ui"></div>
            <div id="transition-layer"></div>

            <div id="keyboard-overlay">
                Press SPACE to Start<br>
                <small>This is to focus the game, so if you click "fullscreen", you may have to click back in a few times. Also, this game doesn't let the page scroll, you'll have to enter fullscreen for that.</small>
            </div>
        </div>
    </div>

    <button class="fullscreen-btn" onclick="goFullscreen()">
        ⛶ Fullscreen
    </button>
</div>

<script type="module" src="main.bundle.js" defer></script>

<script>
    const overlay = document.getElementById("keyboard-overlay");
    const canvas = document.getElementById("screen");

    // Keyboard overlay: start game
    function startGame() {
        overlay.style.display = "none"; // hide overlay
        canvas.focus();
    }

    function keyHandler(e) {
        if (e.code === "Space") {
            startGame();
            document.removeEventListener("keydown", keyHandler);
        }
    }

    document.addEventListener("keydown", keyHandler);

    // Click to refocus
    document.getElementById("game-content-anchor").addEventListener("click", () => {
        canvas.focus();
    });

    // Fullscreen helper
    function goFullscreen() {
        const elem = document.getElementById("gameContainer");
        if (elem.requestFullscreen) {
            elem.requestFullscreen().then(() => {
                canvas.focus();
            });
        } else if (elem.webkitRequestFullscreen) {
            elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
            elem.msRequestFullscreen();
        }
    }
</script>

</body>
</html>
