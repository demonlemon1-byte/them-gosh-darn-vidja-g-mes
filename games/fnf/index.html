<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friday Night Funkin'</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #5f9ea0;
    color: white;
    text-align: center;
    padding: 40px 20px;
}
.game-wrapper {
    margin: 30px auto;
    max-width: 900px;
}
.game-container {
    position: relative;
    width: 100%;
    height: 600px;
    background: rgba(0,0,0,0.5);
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(95,158,160,0.8);
    overflow: hidden;
}
.game-container canvas {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 10;
}
.fullscreen-btn {
    margin-top: 15px;
    padding: 10px 20px;
    background: #222;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-size: 14px;
}
.fullscreen-btn:hover { background: #333; }
#container {
    width: 800px;
    height: 600px;
    transform-origin: top left;
}
</style>
</head>
<body>

<h1>Friday Night Funkin'</h1>
<p><a href="../../index.html">← Back to Home</a></p>

<div class="game-wrapper">
    <div class="game-container" id="gameContainer">
        <div id="root">
            <div id="container"></div> <!-- Mount point for FNF -->
        </div>
    </div>
    <button class="fullscreen-btn" onclick="goFullscreen()">⛶ Fullscreen</button>
</div>

<script>
var version = 1;
var container = document.getElementById("container");
var wrapper = document.getElementById("gameContainer");

function addScript(src, buster, callback){
    var s = document.createElement('script');
    s.src = src + '?v=' + buster;
    s.onload = callback;
    document.body.appendChild(s);
}

// Load main game script
addScript("Funkin.js", version, () => { 
    console.log("Funkin.js loaded."); 
});

// Fullscreen
function goFullscreen(){
    if (wrapper.requestFullscreen) wrapper.requestFullscreen();
    else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
    else if (wrapper.msRequestFullscreen) wrapper.msRequestFullscreen();
}

// Scale container to fit wrapper
function resizeGame(){
    const scaleX = wrapper.clientWidth / 800;
    const scaleY = wrapper.clientHeight / 600;
    const scale = Math.min(scaleX, scaleY);
    container.style.transform = "scale(" + scale + ")";
}

window.addEventListener('resize', resizeGame);
window.addEventListener('load', resizeGame);
</script>

</body>
</html>
