<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FNF - Debug</title>
<style>
body { margin:0; font-family: Arial; background:#5f9ea0; color:white; text-align:center; padding:40px 20px; }
.game-wrapper { margin:30px auto; max-width:900px; }
.game-container { position:relative; width:100%; height:600px; background:rgba(0,0,0,0.5); border-radius:20px; overflow:hidden; }
.fullscreen-btn { margin-top:15px; padding:10px 20px; background:#222; border:none; border-radius:8px; color:white; cursor:pointer; }
.fullscreen-btn:hover{background:#333;}
#debug-log { position:absolute; top:0; left:0; background:rgba(0,0,0,0.8); color:#ff0; padding:10px; font-size:12px; max-height:100%; overflow-y:auto; text-align:left;}
</style>
</head>
<body>

<h1>Friday Night Funkin' - Debug</h1>

<div class="game-wrapper">
    <div class="game-container" id="gameContainer">
        <div id="debug-log">Loading...</div>
        <div id="root"><div id="container"></div></div>
    </div>
    <button class="fullscreen-btn" onclick="goFullscreen()">⛶ Fullscreen</button>
</div>

<script>
var version = 1;
var gameName = "Funkin.js";
var debugLog = document.getElementById("debug-log");

function log(msg){ debugLog.innerHTML += msg + "<br>"; }

function addScript(src, buster, callback){
    var fullSrc = src + '?v=' + buster;
    var s = document.createElement('script');
    s.src = fullSrc;
    s.onload = () => { log("✅ Loaded: " + fullSrc); if(callback) callback(); };
    s.onerror = () => { log("❌ Failed: " + fullSrc); if(callback) callback(); };
    document.body.appendChild(s);
    log("⏳ Attempting: " + fullSrc);
}

function goFullscreen(){
    const elem = document.getElementById("gameContainer");
    if (elem.requestFullscreen) elem.requestFullscreen();
    else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
    else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
}

function resizeGame(){
    const container = document.getElementById("container");
    const wrapper = document.getElementById("gameContainer");
    const gameWidth = 800, gameHeight = 600;
    const scaleX = wrapper.clientWidth / gameWidth;
    const scaleY = wrapper.clientHeight / gameHeight;
    const scale = Math.min(scaleX, scaleY);
    container.style.transform = 'scale(' + scale + ')';
    log("Container size: " + wrapper.clientWidth + " × " + wrapper.clientHeight + " (scale: " + scale.toFixed(2) + ")");
}

window.addEventListener('resize', resizeGame);
window.addEventListener('load', resizeGame);

// Example of loading a main script
addScript("Funkin.js", version, ()=>{ log("All scripts processed."); });
</script>

</body>
</html>
