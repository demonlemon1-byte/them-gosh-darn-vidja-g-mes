<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moto X3M</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #5f9ea0;
    color: white;
    text-align: center;
    padding: 40px 20px;
}
.game-wrapper {
    margin: 30px auto;
    max-width: 900px;
}
.game-container {
    position: relative;
    width: 100%;
    height: 600px;
    background: rgba(0,0,0,0.5);
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(95,158,160,0.8);
    overflow: hidden;
}
.game-container:fullscreen {
    width: 100vw;
    height: 100vh;
    border-radius: 0;
}
.fullscreen-btn {
    margin-top: 15px;
    padding: 10px 20px;
    background: #222;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-size: 14px;
}
.fullscreen-btn:hover { background: #333; }
</style>
</head>
<body>

<h1 id="gameTitle">Moto X3M</h1>
<p><a href="../index.html">← Back to Home</a></p>

<div class="game-wrapper">
    <div class="game-container" id="gameContainer">
        <!-- Game will appear here -->
    </div>
    <button class="fullscreen-btn" onclick="goFullscreen()">⛶ Fullscreen</button>
</div>

<script>
// ----- CONFIG -----
const gameFolder = "./"; // path to game folder
const container = document.getElementById("gameContainer");

// ----- HELPER FUNCTIONS -----
async function fileExists(url) {
    try {
        const res = await fetch(url, { method: 'HEAD' });
        return res.ok;
    } catch (e) {
        return false;
    }
}

function loadScript(src) {
    return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error(`Failed to load ${src}`));
        document.body.appendChild(s);
    });
}

// ----- MAIN LOADER -----
async function loadAllJS() {
    const response = await fetch(gameFolder); // NOTE: GitHub pages won't list files; might need manual list
    let files = []; // placeholder if directory listing not available

    // If you know filenames, replace this with actual array of JS files in the folder:
    files = [
        "nape.min.js",      // dependency example
        "motox3m.min.js"    // main game
    ];

    // Optional: sort so largest file is last (main game)
    // Not implemented in GitHub Pages because we can't check size; manual ordering safer

    // Load scripts sequentially
    for (let f of files) {
        const fullPath = gameFolder + f;
        if (await fileExists(fullPath)) {
            console.log(`Loading ${f}...`);
            await loadScript(fullPath);
        } else {
            console.warn(`File not found: ${f}`);
        }
    }

    console.log("All scripts loaded!");
}

// ----- START -----
loadAllJS().catch(console.error);

// ----- FULLSCREEN -----
function goFullscreen() {
    if (container.requestFullscreen) container.requestFullscreen();
    else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
    else if (container.msRequestFullscreen) container.msRequestFullscreen();
}

// ----- OPTIONAL RESIZE -----
function resizeGameContainer() {
    const w = window.innerWidth;
    const h = window.innerHeight - 100;
    container.style.width = Math.min(900, w) + "px";
    container.style.height = Math.max(400, h) + "px";
}
window.addEventListener("resize", resizeGameContainer);
resizeGameContainer();
</script>

</body>
</html>
