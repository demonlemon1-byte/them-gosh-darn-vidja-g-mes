<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stickman Hook</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .game-wrapper {
            margin: 20px auto;
            max-width: 900px;
        }

        /* The Container */
        #gameContainer {
            position: relative;
            width: 100%;
            height: 600px;
            background: #000;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex; /* Centers the canvas if it's smaller than the box */
            justify-content: center;
            align-items: center;
        }

        /* CRITICAL: This forces the game canvas to behave */
        #gameContainer canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain; 
            display: block;
        }

        /* Loading Indicator */
        #loading-text {
            position: absolute;
            z-index: 10;
            font-weight: bold;
            color: #5f9ea0;
        }

        .fullscreen-btn {
            margin-top: 15px;
            padding: 12px 25px;
            background: #5f9ea0;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background 0.2s;
        }

        .fullscreen-btn:hover {
            background: #7fb3b5;
            transform: scale(1.05);
        }

        a { color: #abdbe3; text-decoration: none; }
    </style>
</head>
<body>

    <h1>Stickman Hook</h1>
    <p><a href="../index.html">← Back to Home</a></p>

    <div class="game-wrapper">
        <div id="gameContainer">
            <div id="loading-text">Loading Game Engine...</div>
            </div>
        <button class="fullscreen-btn" onclick="goFullscreen()">⛶ FULLSCREEN</button>
    </div>

    <script>
        const gameContainer = document.getElementById("gameContainer");
        const loadingText = document.getElementById("loading-text");

        /**
         * 1. THE CANVAS CATCHER
         * This watches the page and moves the game canvas into our div 
         * the microsecond it is created by the game scripts.
         */
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                mutation.addedNodes.forEach((node) => {
                    if (node.tagName === 'CANVAS') {
                        gameContainer.appendChild(node);
                        loadingText.style.display = 'none'; // Hide loading when canvas appears
                        console.log("Game Canvas captured and injected.");
                    }
                });
            });
        });

        observer.observe(document.body, { childList: true, subtree: true });

        /**
         * 2. SCRIPT LOADER
         */
        const gameFolder = "./"; 
        const scriptsToLoad = ["poki3.js", "bundle.js", "poki.js", "poki2.js"];

        function loadGameScripts(files) {
            if (files.length === 0) return;

            const nextFile = files.shift();
            const script = document.createElement('script');
            script.src = gameFolder + nextFile;
            
            script.onload = () => {
                console.log(`Loaded: ${nextFile}`);
                loadGameScripts(files);
            };

            script.onerror = () => {
                console.warn(`Skipping missing file: ${nextFile}`);
                loadGameScripts(files);
            };

            document.body.appendChild(script);
        }

        // Start loading
        loadGameScripts(scriptsToLoad);

        /**
         * 3. FULLSCREEN HANDLER
         */
        function goFullscreen() {
            if (gameContainer.requestFullscreen) {
                gameContainer.requestFullscreen();
            } else if (gameContainer.webkitRequestFullscreen) {
                gameContainer.webkitRequestFullscreen();
            } else if (gameContainer.msRequestFullscreen) {
                gameContainer.msRequestFullscreen();
            }
        }

        // Keep container responsive
        function resizeGame() {
            const w = window.innerWidth;
            if (w < 900) {
                gameContainer.style.height = (w * 0.66) + "px"; // Maintain aspect ratio on mobile
            }
        }
        window.addEventListener("resize", resizeGame);
        resizeGame();
    </script>

</body>
</html>
