<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Ninja</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #5f9ea0;
    color: white;
    text-align: center;
    padding: 40px 20px;
}
.game-wrapper {
    margin: 30px auto;
    max-width: 900px;
}
.game-container {
    position: relative;
    width: 100%;
    height: 600px;
    background: rgba(0,0,0,0.5);
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(95,158,160,0.8);
    overflow: hidden;
}
.game-container canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}
.fullscreen-btn {
    margin-top: 15px;
    padding: 10px 20px;
    background: #222;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-size: 14px;
}
.fullscreen-btn:hover { background: #333; }
</style>
</head>
<body>

<h1>Fruit Ninja</h1>
<p><a href="../index.html">← Back to Home</a></p>

<div class="game-wrapper">
    <div class="game-container" id="gameContainer">
        <div id="game"></div> <!-- Mount point for bundle -->
    </div>
    <button class="fullscreen-btn" onclick="goFullscreen()">⛶ Fullscreen</button>
</div>

<script>
const gameContainer = document.getElementById("gameContainer");
const possibleJSFiles = [
    "main.bundle.js",
    "vendors.bundle.js",
    "poki-sdk-core-v2.234.2.js",
    "poki-sdk.js"
];

function addScriptIfExists(src, callback) {
    fetch(src, { method: 'HEAD' })
        .then(res => {
            if (res.ok) {
                const s = document.createElement('script');
                s.src = src;
                s.onload = callback;
                document.body.appendChild(s);
            } else {
                if(callback) callback();
            }
        }).catch(err => {
            if(callback) callback();
        });
}

function loadGameScripts(files) {
    if (files.length === 0) return;
    const nextFile = files.shift();
    addScriptIfExists(nextFile, () => loadGameScripts(files));
}

loadGameScripts([...possibleJSFiles]);

function goFullscreen() {
    if (gameContainer.requestFullscreen) gameContainer.requestFullscreen();
    else if (gameContainer.webkitRequestFullscreen) gameContainer.webkitRequestFullscreen();
    else if (gameContainer.msRequestFullscreen) gameContainer.msRequestFullscreen();
}

function resizeGameContainer() {
    const w = window.innerWidth;
    const h = window.innerHeight - 100;
    gameContainer.style.width = Math.min(900, w) + "px";
    gameContainer.style.height = Math.max(400, h) + "px";
}
window.addEventListener("resize", resizeGameContainer);
resizeGameContainer();
</script>

</body>
</html>
