<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Ninja - Debug</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #5f9ea0;
    color: white;
    text-align: center;
    padding: 40px 20px;
}
.game-wrapper {
    margin: 30px auto;
    max-width: 900px;
}
.game-container {
    position: relative;
    width: 100%;
    height: 600px;
    background: rgba(0,0,0,0.5);
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(95,158,160,0.8);
    overflow: hidden;
}
.fullscreen-btn {
    margin-top: 15px;
    padding: 10px 20px;
    background: #222;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-size: 14px;
}
.fullscreen-btn:hover { background: #333; }
#debug-log {
    position: absolute;
    top: 0;
    left: 0;
    background: rgba(0,0,0,0.8);
    color: #ff0;
    padding: 10px;
    font-size: 12px;
    max-height: 100%;
    overflow-y: auto;
    text-align: left;
}
</style>
</head>
<body>

<h1>Fruit Ninja - Debug</h1>

<div class="game-wrapper">
    <div class="game-container" id="gameContainer">
        <div id="debug-log">Loading...</div>
    </div>
    <button class="fullscreen-btn" onclick="goFullscreen()">⛶ Fullscreen</button>
</div>

<script>
const gameFolder = "./"; 
const gameContainer = document.getElementById("gameContainer");
const debugLog = document.getElementById("debug-log");

const possibleJSFiles = [
    "main.bundle.js",
    "vendors.bundle.js",
    "poki-sdk-core-v2.234.2.js",
    "poki-sdk.js"
];

function log(msg) {
    debugLog.innerHTML += msg + "<br>";
}

function addScriptIfExists(src, callback) {
    fetch(src, { method: 'HEAD' })
        .then(res => {
            if (res.ok) {
                log("✅ Found: " + src);
                const s = document.createElement('script');
                s.src = src;
                if (callback) s.onload = callback;
                document.body.appendChild(s);
            } else {
                log("❌ Missing: " + src);
                if (callback) callback(); // continue to next
            }
        })
        .catch(err => {
            log("⚠ Error checking: " + src);
            console.warn(err);
            if (callback) callback();
        });
}

function loadGameScripts(files) {
    if (files.length === 0) {
        log("All scripts processed.");
        return;
    }
    const nextFile = files.shift();
    addScriptIfExists(gameFolder + nextFile, () => loadGameScripts(files));
}

loadGameScripts([...possibleJSFiles]);

function goFullscreen() {
    if (gameContainer.requestFullscreen) gameContainer.requestFullscreen();
    else if (gameContainer.webkitRequestFullscreen) gameContainer.webkitRequestFullscreen();
    else if (gameContainer.msRequestFullscreen) gameContainer.msRequestFullscreen();
}

function resizeGameContainer() {
    const w = window.innerWidth;
    const h = window.innerHeight - 100;
    gameContainer.style.width = Math.min(900, w) + "px";
    gameContainer.style.height = Math.max(400, h) + "px";
    log("Container size: " + gameContainer.style.width + " × " + gameContainer.style.height);
}

window.addEventListener("resize", resizeGameContainer);
resizeGameContainer();
</script>

</body>
</html>
