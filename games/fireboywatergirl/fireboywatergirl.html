<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fireboy & Watergirl: Forest Temple</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #5f9ea0;
    color: white;
    text-align: center;
    padding: 40px 20px;
}

h1 {
    margin-bottom: 20px;
}

.game-wrapper {
    margin: 30px auto;
    max-width: 900px;
}

.game-container {
    position: relative;
    width: 100%;
    height: 600px;
    background: rgba(0,0,0,0.5);
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(95,158,160,0.8);
    overflow: hidden;
    transition: all 0.3s ease;
}

.game-container:fullscreen {
    width: 100vw;
    height: 100vh;
    border-radius: 0;
}

.fullscreen-btn {
    margin-top: 15px;
    padding: 10px 20px;
    background: #222;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-size: 14px;
}

.fullscreen-btn:hover {
    background: #333;
}

a.back {
    display: inline-block;
    margin-top: 20px;
    color: white;
    text-decoration: none;
    font-weight: bold;
}
</style>

</head>
<body>

<h1>Fireboy & Watergirl: Forest Temple</h1>
<p><a class="back" href="../../index.html">← Back to Home</a></p>

<div class="game-wrapper">
    <div class="game-container" id="gameContainer">
        <div id="root">
            <div id="container"></div>
            <div id="hammer"></div>
            <div id="debug-fps" style="color:#ff0000; position: absolute; top: 0;"></div>
        </div>
    </div>
    <button class="fullscreen-btn" onclick="goFullscreen()">⛶ Fullscreen</button>
</div>

<!-- JS Dependencies -->
<script type="text/javascript">
    window.requireNode = window.require;
    window.require = undefined; // prevent conflicts with RequireJS
</script>
<script src="bower_components/requirejs/require.js"></script>

<script type="text/javascript">
    var version = 1; // update if needed
    var gameName = "fireboy-and-watergirl-forest-temple.min.js";

    function addScript(src, buster, callback) {
        var s = document.createElement('script');
        s.src = src + '?v=' + buster;
        if (callback) s.onload = callback;
        document.body.appendChild(s);
    }

    // Load the version file first, then the game
    addScript('version.js', 1, function () {
        require([gameName + '?v=' + version]);
    });

    // Fullscreen button logic
    function goFullscreen() {
        const elem = document.getElementById("gameContainer");
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
}
    
    function resizeGame() {
    const container = document.getElementById("container");
    const gameWidth = 800;   // original width of Fireboy & Watergirl
    const gameHeight = 600;  // original height
    const wrapper = document.getElementById("gameContainer");

    const scaleX = wrapper.clientWidth / gameWidth;
    const scaleY = wrapper.clientHeight / gameHeight;

    const scale = Math.min(scaleX, scaleY); // fit entirely
    container.style.setProperty('--scale', scale);
}

// Run initially and on window resize
window.addEventListener('resize', resizeGame);
window.addEventListener('load', resizeGame);
</script>

</body>
</html>
